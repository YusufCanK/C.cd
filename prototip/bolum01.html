<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kat 9 Bölüm 1</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
svg{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block}
.m{display:none}.m.on{display:inline}
/* ---- ortak ---- */
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.005,1.009)}}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes swayL{0%,100%{transform:rotate(0)}50%{transform:rotate(.9deg)}}
@keyframes swayR{0%,100%{transform:rotate(0)}50%{transform:rotate(-.9deg)}}
@keyframes flk{0%{opacity:1}30%{opacity:.8}34%{opacity:1}70%{opacity:.7}74%{opacity:.95}100%{opacity:1}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.cam{transform-origin:540px 960px;animation:zoomS var(--dur) ease-in-out both}
@keyframes zoomS{from{transform:scale(1)}to{transform:scale(1.1)}}
/* ---- Deniz ---- */
.deniz .d-torso{transform-origin:0 1100px;animation:breathe 3.4s ease-in-out infinite}
.deniz .d-armL{transform-origin:-230px 260px;animation:swayL 3.4s ease-in-out infinite}
.deniz .d-armR{transform-origin:230px 260px;animation:swayR 3.4s ease-in-out infinite}
.deniz .d-head{transform-origin:0 190px}
.deniz .d-browL{transform-origin:-85px -58px;transform:rotate(8deg)}.deniz .d-browR{transform-origin:85px -58px;transform:rotate(-8deg)}
.deniz .d-eyes{transform-origin:0 -5px}
.deniz[data-mood="worried"] .d-browL{transform:translateY(-8px) rotate(-12deg)}.deniz[data-mood="worried"] .d-browR{transform:translateY(-8px) rotate(12deg)}
.deniz[data-mood="scared"] .d-browL{transform:translateY(-20px) rotate(-18deg)}.deniz[data-mood="scared"] .d-browR{transform:translateY(-20px) rotate(18deg)}
.deniz[data-mood="scared"] .d-eyes{transform:scale(1.25)}
.deniz[data-mood="scared"] .d-head{animation:shake .11s linear infinite}
@keyframes shake{0%{transform:rotate(-1.4deg) translateX(-3px)}50%{transform:rotate(1.4deg) translateX(3px)}100%{transform:rotate(-1.4deg) translateX(-3px)}}
.lookwin .d-head{animation:headturn var(--dur) ease-in-out both}
@keyframes headturn{0%,30%{transform:rotate(0) translateY(0)}48%,78%{transform:rotate(4deg) translate(8px,3px)}92%,100%{transform:rotate(1deg) translate(3px,1px)}}
.lookwin .d-feat{animation:featturn var(--dur) ease-in-out both}
@keyframes featturn{0%,30%{transform:translateX(0)}48%,100%{transform:translateX(24px)}}
.lookwin .d-eyes{animation:eyeshift var(--dur) ease-in-out both}
@keyframes eyeshift{0%,30%{transform:translateX(0)}48%,100%{transform:translateX(7px)}}
.looklr .d-head{transform-origin:0 190px;animation:lookitems 5s ease-in-out infinite}
@keyframes lookitems{0%,100%{transform:rotate(-3deg) translateX(-8px)}50%{transform:rotate(3deg) translateX(8px)}}
/* ---- Ela ---- */
.ela .e-torso{transform-origin:0 1100px;animation:breathe 3s ease-in-out infinite}
.ela .e-braidL{transform-origin:-185px 40px;animation:swayB 3.4s ease-in-out infinite}
.ela .e-braidR{transform-origin:185px 40px;animation:swayB 3.4s ease-in-out infinite reverse}
@keyframes swayB{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.ela .e-head{transform-origin:0 200px}
.ela[data-phase="0"] .e-head{transform:rotate(-2deg)}.ela[data-phase="1"] .e-head{transform:rotate(3deg) translateY(10px)}.ela[data-phase="2"] .e-head{transform:rotate(-1deg) translateY(-4px)}
.ela[data-phase="3"] .e-head{animation:shake .13s linear infinite}
.ela .e-eyes{transform-origin:0 -5px}.ela[data-phase="1"] .e-eyes{transform:translateY(9px)}.ela[data-phase="2"] .e-eyes{transform:scale(1.1) translateY(-2px)}.ela[data-phase="3"] .e-eyes{transform:scale(1.22) translateY(-3px)}
.ela .e-browL{transform-origin:-85px -80px;transform:translateY(-8px) rotate(3deg)}.ela .e-browR{transform-origin:85px -80px;transform:translateY(-8px) rotate(-3deg)}
.ela[data-phase="1"] .e-browL{transform:translateY(-4px)}.ela[data-phase="1"] .e-browR{transform:translateY(-4px)}
.ela[data-phase="2"] .e-browL{transform:translateY(-12px) rotate(-10deg)}.ela[data-phase="2"] .e-browR{transform:translateY(-12px) rotate(10deg)}
.ela[data-phase="3"] .e-browL{transform:translateY(-18px) rotate(-16deg)}.ela[data-phase="3"] .e-browR{transform:translateY(-18px) rotate(16deg)}
.ela .e-pen{transform-origin:150px 650px}.ela[data-phase="1"] .e-pen{animation:scribble .55s ease-in-out infinite}
@keyframes scribble{0%,100%{transform:translate(-22px,6px) rotate(-6deg)}50%{transform:translate(26px,-8px) rotate(6deg)}}
.worry{display:none}.ela[data-phase="2"] .smile,.ela[data-phase="3"] .smile{display:none}.ela[data-phase="2"] .worry,.ela[data-phase="3"] .worry{display:inline}
/* ---- sahne 1-3 ---- */
#cam1{transform-origin:540px 1000px;animation:z1 var(--dur) ease-in-out both}@keyframes z1{from{transform:scale(1)}to{transform:scale(1.14)}}
.fogA{animation:driftA 12s linear infinite}.fogB{animation:driftB 17s linear infinite}
@keyframes driftA{from{transform:translateX(-90px)}to{transform:translateX(90px)}}@keyframes driftB{from{transform:translateX(80px)}to{transform:translateX(-80px)}}
.flk{animation:flk 2.2s steps(1) infinite}
#cam2{animation:p2 var(--dur) linear both}@keyframes p2{from{transform:translateX(50px) scale(1.04)}to{transform:translateX(-50px) scale(1.04)}}
.sisli{animation:walk var(--dur) linear both}@keyframes walk{from{transform:translate(var(--x0),var(--y)) scale(var(--s))}to{transform:translate(var(--x1),var(--y)) scale(var(--s))}}
.sisli>g{animation:bob .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
.sisli .head,.sisli2 .head{animation:headt 2.4s ease-in-out infinite}@keyframes headt{0%,100%{transform:rotate(10deg)}50%{transform:rotate(20deg)}}
.sisli .glow,.sisli2 .glow{animation:flk 2.6s steps(1) infinite}
.sisli .keys,.sisli2 .keys{animation:ksw 1.2s ease-in-out infinite;transform-origin:0px 0px}@keyframes ksw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#lampglow{animation:flk 3s steps(1) infinite}
#s3a{transform-origin:540px 960px;animation:z3 2.06s ease-in both}@keyframes z3{from{transform:scale(1)}to{transform:scale(1.08)}}
.win{fill:#f3c46b;animation:off .05s forwards;animation-delay:var(--d)}@keyframes off{to{fill:#0c1620}}
.stat rect,#stat rect{animation:jit .09s steps(2) infinite}@keyframes jit{0%{transform:translateX(-30px)}100%{transform:translateX(30px)}}
#tvscreen{animation:tvoff 1.65s forwards}@keyframes tvoff{0%,84%{transform:scaleY(1)}100%{transform:scaleY(.01)}}
#dial{animation:dialf 1.69s forwards}@keyframes dialf{0%{opacity:1}100%{opacity:.04}}
#needle{animation:nd 1.69s ease-in-out forwards;transform-origin:665px 895px}@keyframes nd{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
/* ---- sahne 5 pusula ---- */
#needle5{transform-origin:640px 1000px;animation:needle5 3s ease-in-out infinite}@keyframes needle5{0%,100%{transform:rotate(-12deg)}25%{transform:rotate(9deg)}50%{transform:rotate(-5deg)}75%{transform:rotate(7deg)}}
/* ---- sahne 6/8 telefon ---- */
#batt6{animation:flk 1s steps(1) infinite}
#notif6{animation:slide6 .5s ease-out both;animation-delay:1.4s}@keyframes slide6{from{transform:translateY(-140px);opacity:0}to{transform:translateY(0);opacity:1}}
#flash8{animation:flash8 .5s ease-out both}@keyframes flash8{0%{opacity:.9}100%{opacity:0}}
/* ---- sahne 10 buzdolabı ---- */
.zin{transform-origin:540px 960px;animation:zin var(--dur) ease-in-out both}@keyframes zin{from{transform:scale(1)}to{transform:scale(1.22)}}
/* ---- sahne 11 merdiven ---- */
#stair{transform-origin:540px 860px;animation:stairz var(--dur) ease-in both}@keyframes stairz{from{transform:scale(1) rotate(0)}to{transform:scale(1.35) rotate(3deg)}}
#drip{animation:drip 2.2s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(900px);opacity:.2}}
/* ---- sahne 12 kapı ---- */
#hand12{animation:reach 1.6s ease-out both}@keyframes reach{from{transform:translate(220px,260px)}to{transform:translate(0,0)}}
#bolt12{transform-origin:700px 1010px;animation:turn12 .5s ease-in-out both;animation-delay:1.9s}@keyframes turn12{from{transform:rotate(0)}to{transform:rotate(90deg)}}
/* ---- sahne 13 eşyalar ---- */
.fl-glow,.ax-spark{opacity:0}
#sc13[data-focus="fener"] .fl-glow{opacity:1;animation:flk 1.6s steps(1) infinite}
#sc13[data-focus="balta"] .ax-spark{opacity:1;animation:flk 1.1s steps(1) infinite}
#sc13[data-focus="fener"] .fl-item{transform:translateY(-12px)}#sc13[data-focus="balta"] .ax-item{transform:translateY(-12px)}
/* ---- sahne 14/15 koridor ---- */
#doorleaf{transform-origin:70px 0;animation:dooropen 1.4s ease-out both}@keyframes dooropen{from{transform:skewY(-6deg) scaleX(1)}to{transform:skewY(-6deg) scaleX(.18)}}
.cam14{transform-origin:540px 860px;animation:z14 var(--dur) ease-in both}@keyframes z14{from{transform:scale(1)}to{transform:scale(1.25)}}
#turn15{transform-origin:540px 1150px;animation:turn15 3.6s ease-in-out both;animation-delay:1.6s}@keyframes turn15{from{transform:scaleX(.18)}to{transform:scaleX(1)}}
#eyes15{animation:eyes15 .6s ease-out both;animation-delay:4.9s}@keyframes eyes15{from{opacity:0}to{opacity:1}}
#pulse15{animation:pulse15 .9s ease-in-out infinite}@keyframes pulse15{0%,100%{opacity:.08}50%{opacity:.22}}
/* ---- sahne 17 kartlar ---- */
.card{transform-origin:center;transform-box:fill-box;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d)}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.qglow{animation:flk 1.4s steps(1) infinite}
/* ---- şablon katmanları ---- */
#cap text{font:900 76px/1 Impact,'Arial Black','Arial Narrow Bold',system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:16px;stroke-linejoin:round;fill:#fff;letter-spacing:1px}

#hud text{paint-order:stroke;stroke:#000;stroke-width:8px;stroke-linejoin:round}
#hud text{paint-order:stroke;stroke:#000;stroke-width:8px;stroke-linejoin:round}

#title .t2{font-size:74px;fill:#fff}

/* ---- ortak ---- */
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.005,1.009)}}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}

.deniz .d-torso{transform-origin:0 1100px;animation:breathe 3.4s ease-in-out infinite}
.deniz .d-armL{transform-origin:-230px 260px;animation:swayL 3.4s ease-in-out infinite}
.deniz .d-armR{transform-origin:230px 260px;animation:swayR 3.4s ease-in-out infinite}

.deniz[data-mood="worried"] .d-browL{transform:translateY(-8px) rotate(-12deg)}.deniz[data-mood="worried"] .d-browR{transform:translateY(-8px) rotate(12deg)}
.deniz[data-mood="scared"] .d-browL{transform:translateY(-20px) rotate(-18deg)}.deniz[data-mood="scared"] .d-browR{transform:translateY(-20px) rotate(18deg)}
.deniz[data-mood="scared"] .d-eyes{transform:scale(1.25)}
.deniz[data-mood="scared"] .d-head{animation:shake .11s linear infinite}

.lookwin .d-head{animation:headturn var(--dur) ease-in-out both}
@keyframes headturn{0%,30%{transform:rotate(0) translateY(0)}48%,78%{transform:rotate(4deg) translate(8px,3px)}92%,100%{transform:rotate(1deg) translate(3px,1px)}}
.lookwin .d-feat{animation:featturn var(--dur) ease-in-out both}
@keyframes featturn{0%,30%{transform:translateX(0)}48%,100%{transform:translateX(24px)}}
.lookwin .d-eyes{animation:eyeshift var(--dur) ease-in-out both}
@keyframes eyeshift{0%,30%{transform:translateX(0)}48%,100%{transform:translateX(7px)}}
.looklr .d-head{transform-origin:0 190px;animation:lookitems 5s ease-in-out infinite}
@keyframes lookitems{0%,100%{transform:rotate(-3deg) translateX(-8px)}50%{transform:rotate(3deg) translateX(8px)}}
/* ---- Ela ---- */
.ela .e-torso{transform-origin:0 1100px;animation:breathe 3s ease-in-out infinite}
.ela .e-braidL{transform-origin:-185px 40px;animation:swayB 3.4s ease-in-out infinite}
.ela .e-braidR{transform-origin:185px 40px;animation:swayB 3.4s ease-in-out infinite reverse}
@keyframes swayB{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.ela .e-head{transform-origin:0 200px}
.ela[data-phase="0"] .e-head{transform:rotate(-2deg)}.ela[data-phase="1"] .e-head{transform:rotate(3deg) translateY(10px)}.ela[data-phase="2"] .e-head{transform:rotate(-1deg) translateY(-4px)}
.ela[data-phase="3"] .e-head{animation:shake .13s linear infinite}
.ela .e-eyes{transform-origin:0 -5px}.ela[data-phase="1"] .e-eyes{transform:translateY(9px)}.ela[data-phase="2"] .e-eyes{transform:scale(1.1) translateY(-2px)}.ela[data-phase="3"] .e-eyes{transform:scale(1.22) translateY(-3px)}
.ela .e-browL{transform-origin:-85px -80px;transform:translateY(-8px) rotate(3deg)}.ela .e-browR{transform-origin:85px -80px;transform:translateY(-8px) rotate(-3deg)}

.ela[data-phase="2"] .e-browL{transform:translateY(-12px) rotate(-10deg)}.ela[data-phase="2"] .e-browR{transform:translateY(-12px) rotate(10deg)}
.ela[data-phase="3"] .e-browL{transform:translateY(-18px) rotate(-16deg)}.ela[data-phase="3"] .e-browR{transform:translateY(-18px) rotate(16deg)}
.ela .e-pen{transform-origin:150px 650px}.ela[data-phase="1"] .e-pen{animation:scribble .55s ease-in-out infinite}
